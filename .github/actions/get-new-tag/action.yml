name: 'Get New Tag Version'
description: 'Calculate new semantic version tag based on PR title and current tag'
author: 'Automation Team'

inputs:
  current-tag:
    description: 'Current version tag (e.g., v1.2.3)'
    required: true
  pr-title:
    description: 'Pull request title in format: <type>:<name>:<title>:<story>'
    required: true

outputs:
  new-tag:
    description: 'New calculated version tag'
    value: ${{ steps.calculate.outputs.new-tag }}

runs:
  using: 'node20'
  main: 'index.js'