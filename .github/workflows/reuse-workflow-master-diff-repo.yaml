name: Reuse workflow from different repo

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: Abijith97/reuse-workflow/.github/workflows/reuse-workflow.yaml@main
  print-outputs:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Print outputs
        run: |
          echo "Build status: ${{ needs.deploy.outputs.build-status }}"